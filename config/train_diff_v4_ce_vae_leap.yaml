seed: 42

dataset:
  dataset_path: 'data/CMapDataset_filtered/leaphand_all.pt'
  gt_robot_names:
    - 'leaphand'
  no_gt_robot_names:
    - 'leaphand_graph_1'
    - 'leaphand_graph_2'
    - 'leaphand_morpho_1'
    - 'leaphand_morpho_2'
    - 'leaphand_morpho_3'
    # - 'allegro'
    # - 'barrett'
    # - 'shadowhand'
    # - 'leaphand'
    # - 'ezgripper'
    # - 'robotiq_3finger'
    # - 'xhand'
  debug_object_names: null
  batch_size: 128
  num_workers: 8
  object_pc_type: 'random'
  no_gt_joint_range: [0.1, 0.9]
  no_gt_q_noise_std: 0.1

model:
  object_encoder_type: 'triposg_vae'  # 'vqvae' or 'triposg_vae'
  vqvae_cfg:
    n_embeddings: 1024
    embedding_dim: 16
    num_point: 25
    num_dim: 64
    local_decode_pts: 40
    beta: 0.25
  vqvae_pretrain: 'ckpt/vqvae.ckpt'
  object_patch: 50
  max_link_node: 25
  robot_links:
    leaphand: 17
    leaphand_graph_1: 13
    leaphand_graph_2: 13
    leaphand_morpho_1: 13
    leaphand_morpho_2: 21
    leaphand_morpho_3: 14
  vae_config:
    pretrained_model: 'VAST-AI/TripoSG'
    subfolder: 'vae'
    latent_channels: 64
    link_embed_dim: 128
  N_t_training: 10
  diffusion_config:
    scheduling: linear
    M: 1000
    beta_min: 0.0001
    beta_max: 0.02
    ddim_steps: 100
    ddim_eta: 1.0
    lambda: 0.2
  denoiser_config:
    t_embed_dim: 200
    V_object_dims: [3, 1, 64]
    V_robot_dims: [3, 3, 128]
    v_conv_dim: 384
    num_heads: 16
    ffn_dim: 1536
    num_layers: 6
    v_out_hidden_dims: [256, 128]
    se3_out_dim: [3, 3]
  inference_config: false
  embodiment:
    - 'leaphand'
    - 'leaphand_graph_1'
    - 'leaphand_graph_2'
    - 'leaphand_morpho_1'
    - 'leaphand_morpho_2'
    - 'leaphand_morpho_3'
  mode: 'train'
  loss_config:
    trans_weight: 1.0
    rot_weight: 1.0
  ce_config:
    p_uncond: 0.1
    no_gt_robot_names: 
      - 'leaphand_graph_1'
      - 'leaphand_graph_2'
      - 'leaphand_morpho_1'
      - 'leaphand_morpho_2'
      - 'leaphand_morpho_3'
    guidance_scale: 1.5
    no_gt_loss_weight: 1.0

train:
  lr: 1.0e-4
  epochs: 700
  lr_step: 20
  lr_gamma: 0.8
  save_interval: 10
  save_dir: 'graph_exp/diff_v4_leap_variant_v2_vae_obj_vae50'
  project_name: 'trograsp-fm'
  experiment_name: 'diff_v4_leap_variant_v2_vae_obj_vae50'
  resume_from: 'graph_exp/diff_v4_leap_variant_v2_vae_obj_vae50/ckpt/epoch=99.ckpt'
  pretrained_from: null
  gpus: 8
  gradient_clip_val: 1.0
  precision: 32
